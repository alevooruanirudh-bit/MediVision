[project]
name = "medivision-ai"
version = "0.1.0"
description = "MediVision AI — self-trained medical imaging copilot (research prototype, not a medical device)"
requires-python = ">=3.11,<3.13"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "ml/kaggle/**/*.ipynb", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "B905", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"ml/kaggle/generate.py" = ["UP031"]  # notebook templates contain braces

[tool.ruff.lint.isort]
known-first-party = ["ml", "app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = [".", "backend"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
markers = ["slow: end-to-end tests that run the trained models"]
