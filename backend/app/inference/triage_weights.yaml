# Triage severity weights (0-1). Documented in docs/MODEL_CARD.md. High = time-critical if present.
# c_i = w_i * evidence_i * confidence_i per positive finding; sorted descending,
# score = 100 * min(1, c_1 + 0.25 c_2 + 0.10 c_3), where
#   evidence_i   = 0.5 + 0.5 * clip((p_i - t_i) / (1 - t_i), 0, 1)  (how far above its threshold)
#   confidence_i = 1 - min(2 * uncertainty_i, 0.5)                   (down-weight uncertain calls)
weights:
  Pneumothorax: 1.00
  Mass: 0.85
  Pneumonia: 0.85
  Consolidation: 0.80
  Edema: 0.80
  Effusion: 0.75
  Nodule: 0.60
  Cardiomegaly: 0.55
  Atelectasis: 0.50
  Infiltration: 0.50
  Emphysema: 0.40
  Fibrosis: 0.40
  Pleural Thickening: 0.30
  Hernia: 0.30
  Fracture: 0.80
  Glioma: 0.95
  Meningioma: 0.80
  Pituitary tumour: 0.75
  Intracranial hemorrhage: 1.00
  Malignancy-suspicious lung nodule: 0.60
  Suspicious breast lesion: 0.55
  Referable diabetic retinopathy: 0.35
  Suspicious for breast cancer (mammography): 0.55
  Lung nodule (whole-scan detection): 0.50
  FDG-avid tumour (PET-CT): 0.60
levels:          # lower bounds
  CRITICAL: 75
  URGENT: 45
  ROUTINE: 1     # any positive finding, or a doubtful / out-of-distribution input
  NORMAL: 0
