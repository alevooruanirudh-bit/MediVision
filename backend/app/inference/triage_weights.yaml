# Triage severity weights (0-1). Documented in docs/MODEL_CARD.md. High = time-critical if present.
# score = 100 * (1 - prod_i (1 - w_i * evidence_i * confidence_i)) over positive findings, where
#   evidence_i   = 0.5 + 0.5 * clip((p_i - t_i) / (1 - t_i), 0, 1)  (how far above its threshold)
#   confidence_i = 1 - min(2 * uncertainty_i, 0.5)                   (down-weight uncertain calls)
weights:
  Pneumothorax: 1.00
  Mass: 0.85
  Pneumonia: 0.85
  Consolidation: 0.80
  Edema: 0.80
  Effusion: 0.75
  Nodule: 0.60
  Cardiomegaly: 0.55
  Atelectasis: 0.50
  Infiltration: 0.50
  Emphysema: 0.40
  Fibrosis: 0.40
  Pleural Thickening: 0.30
  Hernia: 0.30
  Fracture: 0.80
  Glioma: 0.95
  Meningioma: 0.80
  Pituitary tumour: 0.75
levels:          # lower bounds
  CRITICAL: 70
  URGENT: 45
  ROUTINE: 1     # any positive finding, or a doubtful / out-of-distribution input
  NORMAL: 0
